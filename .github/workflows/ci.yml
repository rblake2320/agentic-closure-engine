name: Phase 0 kernel acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - name: Verify installed wheel, signatures, ledger, interruption and scenarios
        run: python tools/verify_phase0.py --output evidence-runs/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase0-${{ matrix.os }}-python${{ matrix.python }}
          path: |
            evidence-runs/ci/receipt.json
            evidence-runs/ci/tests.xml
            evidence-runs/ci/sbom.json
            evidence-runs/ci/*.stdout.txt
            evidence-runs/ci/*.stderr.txt
            evidence-runs/ci/scenarios/**/*.json
          retention-days: 14
