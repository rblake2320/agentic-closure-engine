# Optional real JSON publishing target. Supply an actual initial artifact with --PublisherArtifact.
services:
  bootstrap:
    volumes:
      - publisher-data:/volumes/publisher-data
      - ${ACE_RUNTIME_DIRECTORY:-./.runtime}/initial-artifact.json:/input/initial-artifact.json:ro
  publisher:
    image: agentic-closure-engine:0.3.1
    user: '11008:11008'
    command: [publisher]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    tmpfs: ['/tmp:size=16m,mode=1777']
    restart: unless-stopped
    labels:
      ace.product: closure-engine
      ace.trust_hash: ${ACE_TRUST_HASH:-bootstrap-pending}
    networks: [roles, publisher-frontend]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    volumes:
      - publisher-data:/publisher
    ports: ['127.0.0.1:${ACE_PUBLISHER_PORT:-8784}:9002']
networks:
  publisher-frontend: {}
volumes:
  publisher-data: {}
